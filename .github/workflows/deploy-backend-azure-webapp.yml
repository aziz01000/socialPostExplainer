name: Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-azure-webapp.yml"
  workflow_dispatch:

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          if [ -z "${{ vars.AZURE_BACKEND_WEBAPP_NAME }}" ]; then
            echo "Missing repo variable: AZURE_BACKEND_WEBAPP_NAME"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_CLIFF_05AD2E110 }}" ]; then
            echo "Missing repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_CLIFF_05AD2E110"
            exit 1
          fi

      # Optional pre-deploy sanity check
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_CLIFF_05AD2E110 }}
          package: ./backend
