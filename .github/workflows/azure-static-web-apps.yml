# Deploy frontend to Azure Static Web Apps when pushing to main (or opening/updating PRs).
# Backend must be hosted separately (e.g. Azure Container Apps, App Service) and
# REACT_APP_API_BASE_URL set in repo variables/secrets or in Azure SWA app settings.
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      # Optional: set in repo Variables or Secrets for production backend URL
      REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL || secrets.REACT_APP_API_BASE_URL || 'http://localhost:8000' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Add your SWA deployment token in repo Secrets (Azure portal → Static Web App → Manage deployment token)
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_WAVE_075D2CA10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: ""
          output_location: "build"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_WAVE_075D2CA10 }}
          action: "close"
